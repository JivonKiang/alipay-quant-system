name: Deploy Report to GitHub Pages

on:
  push:
    branches: [main]
  # 自动运行：北京时间每天 09:00 / 14:30 / 22:00
  schedule:
    - cron: "0 1,6,14 * * *"
  workflow_dispatch:

# 权限设置
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml requests

      # 尝试运行推荐引擎获取最新数据
      # 如果已有预缓存 (precached_funds.json)，跳过API直接用缓存胜率
      # 如果 API 失败，使用仓库中已有的 output/recommendation.json
      - name: Run Recommendation Engine (with precache)
        run: |
          if [ -f output/precached_funds.json ]; then
            echo "[INFO] 发现预缓存，使用缓存胜率数据"
          fi
          python main.py recommend --output output/recommendation.json || echo "API unavailable, using cached report"
        continue-on-error: true

      - name: Generate HTML Report
        run: python tools/generate_report_html.py --input output/recommendation.json --output output/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
