name: Deploy Report to GitHub Pages

on:
  push:
    branches: [main]
  # 自动运行：每天 11:00/14:30/22:00 各跑一次
  # 11:00 = 09:00 UTC (北京时间)
  # 14:30 = 06:30 UTC (北京时间 14:30)
  # 22:00 = 14:00 UTC (北京时间 22:00)
  schedule:
    - cron: "0 1,6,14 * * *"
  workflow_dispatch:

# 权限设置
permissions:
  contents: write
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      # 尝试运行推荐引擎获取最新数据
      # 交易时段 API 可用 -> 更新缓存
      # 非交易时段 API 失败 -> 使用仓库中已有的 output/recommendation.json
      - name: Run Recommendation Engine
        id: recommend
        run: |
          python main.py recommend --output output/recommendation.json && echo "success=true" >> $GITHUB_OUTPUT || echo "success=false" >> $GITHUB_OUTPUT
        continue-on-error: true

      # 如果推荐引擎成功，将更新的 JSON 提交回仓库（持久化缓存）
      - name: Commit updated report cache
        if: steps.recommend.outputs.success == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/recommendation.json
          git diff --cached --quiet || (git commit -m "chore: auto-update report cache [$(date +%Y-%m-%d)]" && git push)

      - name: Generate HTML Report
        run: python tools/generate_report_html.py --input output/recommendation.json --output output/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
