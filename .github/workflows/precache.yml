name: Weekend Precache

on:
  push:
    branches: [main]
    paths: ['tools/precache.py', 'engine/fund_screener.py', 'engine/board_scanner.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  precache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Run Precache
        run: python main.py precache

      - name: Commit cached data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/precached_funds.json
          git diff --cached --quiet || (git commit -m "chore: precache fund data [$(date +%Y-%m-%d)]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
